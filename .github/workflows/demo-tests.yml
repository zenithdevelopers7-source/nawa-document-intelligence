name: NAWA synthetic demo tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and optional OCR dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'PyJWT[crypto]>=2.10,<3'
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Test synthetic quotation, PDF and OCR demos
        run: |
          cd demo
          python -m unittest discover -s tests -v
          node tests/test_intake_ui.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nawa_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nawa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawa_test -d nawa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NAWA_TEST_POSTGRES: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: nawa_test
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_DB: nawa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
      - name: Test isolated PostgreSQL persistence
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_*postgres*.py' -v

  windows-synthetic-intake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic intake dependency
        run: python -m pip install -r demo/requirements-phase13.txt -r demo/requirements-pdf.txt
      - name: Verify Windows limits and synthetic document processing
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_intake_limits.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_intake_validation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_intake_store.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_intake_worker.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser_intake_mock.py
          exit $LASTEXITCODE

  phase13-postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawa_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nawa_phase13_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawa_test -d nawa_phase13_qa_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: synthetic-ci-only
      NAWA_PHASE13_TEST_DSN: 'host=127.0.0.1 port=5432 dbname=nawa_phase13_qa_ci user=nawa_test password=synthetic-ci-only'
      NAWA_INTAKE: synthetic
      NAWA_AUTH: oidc
      NAWA_STORAGE: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: nawa_phase13_qa_ci
      POSTGRES_USER: nawa_test
      POSTGRES_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Create isolated synthetic schema
        run: |
          for file in demo/nawa_demo/migrations/00*.sql; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U nawa_test -d nawa_phase13_qa_ci -f "$file"
          done
          cd demo
          python -m nawa_demo.intake_migrate
      - name: Test synthetic intake and recovery
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_intake_postgres.py' -v

  local-oidc-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated synthetic identity fixture
        run: |
          python -m pip install 'cryptography>=42,<51'
          cd demo
          python -m nawa_demo.prepare_oidc_fixture --output ../.data/phase12-identity
      - name: Build QA image
        run: docker build -t nawa-phase12-test .
      - name: Start isolated QA services
        run: docker compose -p nawa-phase12-ci -f compose.phase12-qa.yaml up -d
      - name: Verify local synthetic Keycloak flow
        run: docker compose -p nawa-phase12-ci -f compose.phase12-qa.yaml exec -T nawa python -m nawa_demo.phase12_live_check

  phase13-local-oidc-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NAWA_SYNTHETIC_EVIDENCE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create separate synthetic identity fixture
        run: |
          python -m pip install 'cryptography>=42,<51' 'psycopg[binary]>=3.2,<4' 'playwright==1.56.0' 'PyMuPDF==1.28.2'
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"; then
            python -m playwright install-deps chromium
            python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"
          fi
          cd demo
          python -m nawa_demo.prepare_oidc_fixture --phase 13 --output ../.data/phase13-identity
      - name: Build synthetic Phase 13 QA image
        run: docker build -t nawa-phase13-test .
      - name: Start isolated Phase 13 QA services
        run: docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml up -d
      - name: Test synthetic Keycloak and intake flow
        run: docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T nawa python -m nawa_demo.phase13_live_check
      - name: Verify source and result survive service restarts
        run: |
          set -eu
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T nawa python -m nawa_demo.phase13_qa_snapshot > /tmp/nawa13-before.json
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml stop nawa
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml restart db
          ready=0
          for i in $(seq 1 30); do
            if docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T db pg_isready -U nawa_test -d nawa_phase13_qa_demo >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml up -d nawa
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19765/api/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T nawa python -m nawa_demo.phase13_qa_snapshot > /tmp/nawa13-after.json
          cmp /tmp/nawa13-before.json /tmp/nawa13-after.json
      - name: Verify safe response and recovery after database outage
        run: |
          set -eu
          restore_db() { docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml start db >/dev/null 2>&1 || true; }
          trap restore_db EXIT
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml stop db
          code=$(curl --silent --show-error --max-time 10 -o /tmp/nawa13-outage.json -w '%{http_code}' http://127.0.0.1:19765/api/ready)
          test "$code" = 503
          python -c "import json; assert json.load(open('/tmp/nawa13-outage.json')) == {'error': 'Quotation storage unavailable'}"
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml start db
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:19765/api/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T nawa python -m nawa_demo.phase13_qa_snapshot > /tmp/nawa13-recovered.json
          cmp /tmp/nawa13-before.json /tmp/nawa13-recovered.json
          trap - EXIT
      - name: Verify authenticated intake fails safely and recovers
        env:
          NAWA_PHASE13_CI_QA: '1'
          PYTHONPATH: demo
        run: python -m nawa_demo.phase13_auth_outage_check
      - name: Test live synthetic intake and review in a real browser
        env:
          NAWA_PHASE13_CI_QA: '1'
          PYTHONPATH: demo
        run: python -m nawa_demo.phase13_browser_live_check
      - name: Verify browser rejects the untrusted synthetic identity certificate
        env:
          NAWA_PHASE13_CI_QA: '1'
          PYTHONPATH: demo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          python -m nawa_demo.phase13_browser_oidc_check --expect-untrusted
      - name: Trust synthetic CA only on the disposable CI runner
        run: |
          set -eu
          test "$GITHUB_ACTIONS" = true
          nawa_nss_dir="$HOME/.pki/nssdb"
          mkdir -p "$nawa_nss_dir"
          if [ ! -f "$nawa_nss_dir/cert9.db" ]; then
            certutil -d "sql:$nawa_nss_dir" -N --empty-password
          fi
          certutil -d "sql:$nawa_nss_dir" -A -t 'C,,' -n 'NAWA synthetic CI CA' -i .data/phase13-identity/ca.pem
      - name: Verify browser-driven synthetic sign-in and logout
        env:
          NAWA_PHASE13_CI_QA: '1'
          PYTHONPATH: demo
        run: python -m nawa_demo.phase13_browser_oidc_check

